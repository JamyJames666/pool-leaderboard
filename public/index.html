<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool Leaderboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0e0b;
      --surface: #131713;
      --surface2: #1a201a;
      --border: #252e25;
      --border2: #2e3a2e;
      --green: #22c55e;
      --green-dim: #16a34a;
      --green-glow: rgba(34,197,94,0.12);
      --text: #f0f4f0;
      --muted: #6b7d6b;
      --muted2: #8a9e8a;
      --danger: #ef4444;
      --danger-dim: rgba(239,68,68,0.15);
      --gold: #f59e0b;
      --silver: #94a3b8;
      --bronze: #cd7c3a;
      --radius: 10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* --- HEADER --- */
    .header {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 56px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title span { font-size: 20px; }
    .auth-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .auth-badge .role-pill {
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .role-pill.admin { background: rgba(245,158,11,0.15); color: var(--gold); border: 1px solid rgba(245,158,11,0.3); }
    .role-pill.user { background: var(--green-glow); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .btn-logout {
      background: none;
      border: 1px solid var(--border2);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .btn-logout:hover { border-color: var(--muted); color: var(--text); }
    .btn-login-header {
      background: var(--green);
      border: none;
      color: #000;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-login-header:hover { background: #16a34a; }

    /* --- TABS --- */
    .tabs {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      gap: 0;
      overflow-x: auto;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      padding: 14px 16px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--green); border-bottom-color: var(--green); }

    /* --- CONTENT --- */
    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* --- BUTTONS --- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--green); color: #000; }
    .btn-primary:hover { background: var(--green-dim); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
    .btn-secondary:hover { border-color: var(--muted); }
    .btn-danger { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(239,68,68,0.25); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 5px; width: 28px; height: 28px; justify-content: center; }

    /* --- INPUTS --- */
    input[type="text"], input[type="password"] {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 9px 12px;
      border-radius: var(--radius);
      font-size: 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: var(--green); }
    input::placeholder { color: var(--muted); }

    /* --- CARDS --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .card + .card { margin-top: 12px; }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    /* --- TABLE --- */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }

    /* --- LEADERBOARD --- */
    .rank-cell { width: 48px; text-align: center; }
    .rank-num { font-size: 13px; font-weight: 700; color: var(--muted); }
    .rank-1 .rank-badge { color: var(--gold); font-size: 18px; }
    .rank-2 .rank-badge { color: var(--silver); font-size: 18px; }
    .rank-3 .rank-badge { color: var(--bronze); font-size: 18px; }
    .player-name { font-weight: 600; font-size: 14px; }
    .elo-cell { font-weight: 700; font-size: 15px; }
    .elo-up { color: var(--green); }
    .elo-down { color: var(--danger); }
    .elo-neutral { color: var(--text); }
    .wl-cell { color: var(--muted2); font-variant-numeric: tabular-nums; }
    .winrate-bar-wrap { display: flex; align-items: center; gap: 8px; min-width: 90px; }
    .winrate-bar { height: 4px; border-radius: 2px; background: var(--border2); flex: 1; overflow: hidden; }
    .winrate-fill { height: 100%; border-radius: 2px; background: var(--green); transition: width 0.3s; }
    .winrate-text { font-size: 12px; color: var(--muted2); min-width: 30px; text-align: right; }
    .form-dots { display: flex; gap: 3px; }
    .form-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .form-dot.W { background: var(--green); }
    .form-dot.L { background: var(--danger); }
    .form-dot.empty { background: var(--border2); }

    /* --- RECORD MATCH --- */
    .match-form { display: grid; gap: 16px; max-width: 480px; }
    .form-row { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--muted2); text-transform: uppercase; letter-spacing: 0.4px; }
    .vs-divider {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      padding: 4px 0;
    }
    .result-preview {
      background: var(--green-glow);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 13px;
      color: var(--muted2);
    }
    .result-preview strong { color: var(--text); }
    .result-preview .elo-gain { color: var(--green); font-weight: 600; }
    .result-preview .elo-loss { color: var(--danger); font-weight: 600; }

    /* --- SEARCHABLE DROPDOWN --- */
    .select-wrap { position: relative; }
    .dropdown-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      z-index: 50;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .dropdown-list.hidden { display: none; }
    .dropdown-item {
      padding: 9px 12px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dropdown-item:hover { background: var(--surface); color: var(--green); }
    .dropdown-item .item-elo { font-size: 11px; color: var(--muted); }
    .dropdown-empty { padding: 10px 12px; color: var(--muted); font-size: 13px; }

    /* --- MATCH HISTORY --- */
    .match-row td { font-size: 13px; }
    .match-players { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .match-winner { font-weight: 600; color: var(--text); }
    .match-loser { color: var(--muted2); }
    .match-arrow { color: var(--muted); font-size: 12px; }
    .elo-change-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .elo-change-badge.gain { background: var(--green-glow); color: var(--green); }
    .elo-change-badge.loss { background: var(--danger-dim); color: var(--danger); }
    .match-date { color: var(--muted); font-size: 12px; white-space: nowrap; }

    /* --- PLAYERS TAB --- */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .player-card-info { flex: 1; min-width: 0; }
    .player-card-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-card-stats { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .player-card-actions { display: flex; gap: 4px; }
    .add-player-form { display: flex; gap: 8px; max-width: 360px; }

    /* --- LOGIN OVERLAY --- */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-overlay.hidden { display: none; }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 32px 28px;
      width: 100%;
      max-width: 360px;
    }
    .login-icon { font-size: 40px; text-align: center; margin-bottom: 12px; }
    .login-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 24px; }
    .login-form { display: flex; flex-direction: column; gap: 12px; }
    .login-error { color: var(--danger); font-size: 13px; text-align: center; min-height: 20px; }

    /* --- TOAST --- */
    .toast-container {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: auto;
      animation: toastIn 0.2s ease;
      backdrop-filter: blur(8px);
    }
    .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
    .toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .toast.info { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #ccc; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

    /* --- MISC --- */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .empty-state p { font-size: 13px; margin-top: 8px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }
    .section-title { font-size: 15px; font-weight: 700; }
    .badge {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: var(--surface2);
      color: var(--muted2);
      border: 1px solid var(--border2);
    }
    .edit-inline { display: flex; gap: 6px; align-items: center; }
    .edit-inline input { width: 140px; padding: 5px 8px; font-size: 13px; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-row td { text-align: center; padding: 32px; color: var(--muted); }
  </style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- Login overlay -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">🎱</div>
    <h1 class="login-title">Pool Leaderboard</h1>
    <p class="login-sub">Enter the password to continue</p>
    <form class="login-form" id="loginForm">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <p class="login-error" id="loginError"></p>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Sign in</button>
    </form>
  </div>
</div>

<!-- Main app -->
<div id="app" class="hidden" style="display:none">
  <header class="header">
    <div class="header-inner">
      <div class="header-title"><span>🎱</span> Pool Leaderboard</div>
      <div class="auth-badge">
        <span class="role-pill" id="rolePill"></span>
        <button class="btn-logout" id="logoutBtn">Sign out</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="leaderboard">Leaderboard</button>
      <button class="tab-btn" data-tab="record">Record Match</button>
      <button class="tab-btn" data-tab="history">Match History</button>
      <button class="tab-btn" data-tab="players">Players</button>
    </div>
  </header>

  <main class="main">
    <!-- LEADERBOARD TAB -->
    <div class="tab-content active" id="tab-leaderboard">
      <div class="section-header">
        <span class="section-title">Rankings</span>
        <button class="btn btn-secondary btn-sm" id="refreshLeaderboard">Refresh</button>
      </div>
      <div class="card" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="rank-cell">#</th>
                <th>Player</th>
                <th>ELO</th>
                <th>W / L</th>
                <th>Win Rate</th>
                <th>Form</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
              <tr><td colspan="6" class="loading-row"><span class="spinner"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- RECORD MATCH TAB -->
    <div class="tab-content" id="tab-record">
      <div class="section-header">
        <span class="section-title">Record a Result</span>
      </div>
      <div class="card">
        <div class="match-form" id="matchForm">
          <div class="form-row">
            <label class="form-label">Winner</label>
            <div class="select-wrap" id="winnerWrap">
              <input type="text" class="player-search" id="winnerSearch" placeholder="Search player..." autocomplete="off">
              <div class="dropdown-list hidden" id="winnerDropdown"></div>
            </div>
            <input type="hidden" id="winnerId">
          </div>
          <div class="vs-divider">DEFEATED</div>
          <div class="form-row">
            <label class="form-label">Loser</label>
            <div class="select-wrap" id="loserWrap">
              <input type="text" class="player-search" id="loserSearch" placeholder="Search player..." autocomplete="off">
              <div class="dropdown-list hidden" id="loserDropdown"></div>
            </div>
            <input type="hidden" id="loserId">
          </div>
          <div id="matchPreview" style="display:none"></div>
          <button class="btn btn-primary" id="submitMatch" disabled style="width:fit-content">Record Result</button>
        </div>
      </div>
    </div>

    <!-- HISTORY TAB -->
    <div class="tab-content" id="tab-history">
      <div class="section-header">
        <span class="section-title">Match History</span>
        <span class="badge" id="matchCount">0 matches</span>
      </div>
      <div class="card" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Result</th>
                <th>ELO Change</th>
                <th>Date</th>
                <th id="adminHistoryCol" style="display:none"></th>
              </tr>
            </thead>
            <tbody id="historyBody">
              <tr><td colspan="4" class="loading-row"><span class="spinner"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- PLAYERS TAB -->
    <div class="tab-content" id="tab-players">
      <div class="section-header">
        <span class="section-title">Players</span>
        <span class="badge" id="playerCount">0 players</span>
      </div>
      <div class="card" style="margin-bottom:16px">
        <p class="card-title">Add Player</p>
        <div class="add-player-form">
          <input type="text" id="newPlayerName" placeholder="Player name" maxlength="40">
          <button class="btn btn-primary" id="addPlayerBtn">Add</button>
        </div>
      </div>
      <div id="playerGrid" class="player-grid">
        <div style="grid-column:1/-1;text-align:center;padding:32px;color:var(--muted)">
          <span class="spinner"></span>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // --- STATE ---
  let token = sessionStorage.getItem('pool_token') || '';
  let role = sessionStorage.getItem('pool_role') || '';
  let players = [];
  let editingPlayerId = null;

  // --- TOAST ---
  function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  // --- API ---
  async function api(method, path, body) {
    const opts = {
      method,
      headers: { 'Content-Type': 'application/json' },
    };
    if (token) opts.headers['Authorization'] = `Bearer ${token}`;
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  // --- AUTH ---
  function showApp() {
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('app').style.display = '';
    document.getElementById('rolePill').textContent = role === 'admin' ? 'Admin' : 'User';
    document.getElementById('rolePill').className = `role-pill ${role}`;
    if (role === 'admin') {
      document.getElementById('adminHistoryCol').style.display = '';
    }
    loadAll();
  }

  function showLogin() {
    document.getElementById('loginOverlay').classList.remove('hidden');
    document.getElementById('app').style.display = 'none';
    token = '';
    role = '';
    sessionStorage.removeItem('pool_token');
    sessionStorage.removeItem('pool_role');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      const data = await api('POST', '/api/login', { password });
      token = data.token;
      role = data.role;
      sessionStorage.setItem('pool_token', token);
      sessionStorage.setItem('pool_role', role);
      showApp();
    } catch (err) {
      errEl.textContent = err.message;
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    try { await api('POST', '/api/logout'); } catch (_) {}
    showLogin();
  });

  // --- TABS ---
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      if (btn.dataset.tab === 'leaderboard') loadLeaderboard();
      if (btn.dataset.tab === 'history') loadHistory();
      if (btn.dataset.tab === 'players') loadPlayers();
      if (btn.dataset.tab === 'record') loadPlayersForDropdowns();
    });
  });

  // --- LEADERBOARD ---
  async function loadLeaderboard() {
    const tbody = document.getElementById('leaderboardBody');
    try {
      const data = await api('GET', '/api/leaderboard');
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">No players yet<p>Add players in the Players tab</p></div></td></tr>`;
        return;
      }
      tbody.innerHTML = data.map(p => {
        const rankBadge = p.rank === 1 ? '🥇' : p.rank === 2 ? '🥈' : p.rank === 3 ? '🥉' : `<span class="rank-num">${p.rank}</span>`;
        const eloClass = p.elo > 1000 ? 'elo-up' : p.elo < 1000 ? 'elo-down' : 'elo-neutral';
        const form = [...Array(5)].map((_, i) => {
          const r = p.form[i];
          return r ? `<div class="form-dot ${r}" title="${r === 'W' ? 'Win' : 'Loss'}"></div>`
                   : `<div class="form-dot empty"></div>`;
        }).join('');
        const winRate = p.winRate !== null ? p.winRate : '-';
        const winRateFill = p.winRate !== null ? p.winRate : 0;
        return `
          <tr>
            <td class="rank-cell rank-${p.rank}">
              <span class="rank-badge">${rankBadge}</span>
            </td>
            <td><span class="player-name">${esc(p.name)}</span></td>
            <td class="elo-cell ${eloClass}">${p.elo}</td>
            <td class="wl-cell">${p.wins} / ${p.losses}</td>
            <td>
              <div class="winrate-bar-wrap">
                <div class="winrate-bar"><div class="winrate-fill" style="width:${winRateFill}%"></div></div>
                <span class="winrate-text">${winRate !== '-' ? winRate + '%' : '-'}</span>
              </div>
            </td>
            <td><div class="form-dots">${form}</div></td>
          </tr>`;
      }).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--danger)">${esc(err.message)}</td></tr>`;
    }
  }

  document.getElementById('refreshLeaderboard').addEventListener('click', loadLeaderboard);

  // --- HISTORY ---
  async function loadHistory() {
    const tbody = document.getElementById('historyBody');
    try {
      const data = await api('GET', '/api/matches');
      document.getElementById('matchCount').textContent = `${data.length} match${data.length !== 1 ? 'es' : ''}`;
      if (!data.length) {
        tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state">No matches yet<p>Record your first result</p></div></td></tr>`;
        return;
      }
      const cols = role === 'admin' ? 4 : 3;
      tbody.innerHTML = data.map(m => {
        const date = new Date(m.playedAt);
        const dateStr = date.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
        const timeStr = date.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
        const adminBtn = role === 'admin'
          ? `<td><button class="btn btn-danger btn-sm btn-icon" onclick="deleteMatch('${m.id}')" title="Delete">✕</button></td>`
          : '';
        return `
          <tr class="match-row">
            <td>
              <div class="match-players">
                <span class="match-winner">${esc(m.winnerName)}</span>
                <span class="match-arrow">→</span>
                <span class="match-loser">${esc(m.loserName)}</span>
              </div>
            </td>
            <td>
              <span class="elo-change-badge gain">+${m.eloChange}</span>
              <span class="elo-change-badge loss" style="margin-left:4px">-${m.eloChange}</span>
            </td>
            <td class="match-date">${dateStr} ${timeStr}</td>
            ${adminBtn}
          </tr>`;
      }).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--danger)">${esc(err.message)}</td></tr>`;
    }
  }

  async function deleteMatch(id) {
    if (!confirm('Delete this match? ELO ratings will be recalculated.')) return;
    try {
      await api('DELETE', `/api/matches/${id}`);
      toast('Match deleted — ELO recalculated');
      loadHistory();
      loadLeaderboard();
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  // --- PLAYERS TAB ---
  async function loadPlayers() {
    try {
      players = await api('GET', '/api/players');
      document.getElementById('playerCount').textContent = `${players.length} player${players.length !== 1 ? 's' : ''}`;
      renderPlayerGrid();
    } catch (err) {
      document.getElementById('playerGrid').innerHTML = `<p style="color:var(--danger)">${esc(err.message)}</p>`;
    }
  }

  function renderPlayerGrid() {
    const grid = document.getElementById('playerGrid');
    if (!players.length) {
      grid.innerHTML = `<div style="grid-column:1/-1"><div class="empty-state">No players yet<p>Add the first player above</p></div></div>`;
      return;
    }
    grid.innerHTML = players
      .sort((a, b) => b.elo - a.elo)
      .map(p => {
        const games = p.wins + p.losses;
        const wr = games > 0 ? Math.round(p.wins / games * 100) + '%' : '-';
        if (editingPlayerId === p.id) {
          return `
            <div class="player-card">
              <div class="edit-inline">
                <input type="text" id="editName-${p.id}" value="${esc(p.name)}" maxlength="40">
                <button class="btn btn-primary btn-sm" onclick="savePlayerName('${p.id}')">Save</button>
                <button class="btn btn-secondary btn-sm" onclick="cancelEdit()">Cancel</button>
              </div>
            </div>`;
        }
        const adminActions = role === 'admin' ? `
          <div class="player-card-actions">
            <button class="btn btn-secondary btn-sm btn-icon" onclick="startEdit('${p.id}')" title="Rename">✎</button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="deletePlayer('${p.id}')" title="Delete">✕</button>
          </div>` : '';
        return `
          <div class="player-card">
            <div class="player-card-info">
              <div class="player-card-name">${esc(p.name)}</div>
              <div class="player-card-stats">${p.elo} ELO · ${p.wins}W ${p.losses}L · ${wr}</div>
            </div>
            ${adminActions}
          </div>`;
      }).join('');
  }

  function startEdit(id) {
    editingPlayerId = id;
    renderPlayerGrid();
    setTimeout(() => document.getElementById(`editName-${id}`)?.focus(), 0);
  }

  function cancelEdit() {
    editingPlayerId = null;
    renderPlayerGrid();
  }

  async function savePlayerName(id) {
    const input = document.getElementById(`editName-${id}`);
    const name = input?.value.trim();
    if (!name) return;
    try {
      await api('PUT', `/api/players/${id}`, { name });
      editingPlayerId = null;
      toast('Player renamed');
      loadPlayers();
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  async function deletePlayer(id) {
    const p = players.find(p => p.id === id);
    if (!confirm(`Delete ${p?.name}? All their matches will also be removed and ELO recalculated.`)) return;
    try {
      await api('DELETE', `/api/players/${id}`);
      toast('Player deleted');
      loadPlayers();
      loadLeaderboard();
    } catch (err) {
      toast(err.message, 'error');
    }
  }

  document.getElementById('addPlayerBtn').addEventListener('click', async () => {
    const input = document.getElementById('newPlayerName');
    const name = input.value.trim();
    if (!name) return;
    try {
      await api('POST', '/api/players', { name });
      input.value = '';
      toast(`${name} added`);
      loadPlayers();
    } catch (err) {
      toast(err.message, 'error');
    }
  });

  document.getElementById('newPlayerName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('addPlayerBtn').click();
  });

  // --- SEARCHABLE DROPDOWNS ---
  function makeDropdown(searchId, dropdownId, hiddenId, otherHiddenId) {
    const searchEl = document.getElementById(searchId);
    const dropdownEl = document.getElementById(dropdownId);
    const hiddenEl = document.getElementById(hiddenId);

    function render(query) {
      const filtered = players.filter(p =>
        p.name.toLowerCase().includes(query.toLowerCase()) && p.id !== document.getElementById(otherHiddenId).value
      );
      if (!filtered.length) {
        dropdownEl.innerHTML = `<div class="dropdown-empty">No players found</div>`;
      } else {
        dropdownEl.innerHTML = filtered.map(p =>
          `<div class="dropdown-item" data-id="${p.id}" data-name="${esc(p.name)}">
            <span>${esc(p.name)}</span>
            <span class="item-elo">${p.elo}</span>
          </div>`
        ).join('');
      }
      dropdownEl.classList.remove('hidden');
    }

    searchEl.addEventListener('focus', () => render(searchEl.value));
    searchEl.addEventListener('input', () => {
      hiddenEl.value = '';
      render(searchEl.value);
      updateMatchPreview();
    });
    dropdownEl.addEventListener('mousedown', (e) => {
      const item = e.target.closest('.dropdown-item');
      if (!item) return;
      e.preventDefault();
      hiddenEl.value = item.dataset.id;
      searchEl.value = item.dataset.name;
      dropdownEl.classList.add('hidden');
      updateMatchPreview();
    });
    searchEl.addEventListener('blur', () => {
      setTimeout(() => dropdownEl.classList.add('hidden'), 150);
    });
  }

  async function loadPlayersForDropdowns() {
    try {
      players = await api('GET', '/api/players');
    } catch (_) {}
  }

  function updateMatchPreview() {
    const wId = document.getElementById('winnerId').value;
    const lId = document.getElementById('loserId').value;
    const previewEl = document.getElementById('matchPreview');
    const submitBtn = document.getElementById('submitMatch');

    if (!wId || !lId || wId === lId) {
      previewEl.style.display = 'none';
      submitBtn.disabled = true;
      return;
    }

    const winner = players.find(p => p.id === wId);
    const loser = players.find(p => p.id === lId);
    if (!winner || !loser) return;

    const K = 32;
    const expected = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
    const change = Math.max(1, Math.round(K * (1 - expected)));

    previewEl.innerHTML = `
      <div class="result-preview">
        <strong>${esc(winner.name)}</strong> (${winner.elo}) defeats <strong>${esc(loser.name)}</strong> (${loser.elo})<br>
        <span class="elo-gain">+${change} ELO</span> for ${esc(winner.name)} &nbsp;·&nbsp;
        <span class="elo-loss">-${change} ELO</span> for ${esc(loser.name)}
      </div>`;
    previewEl.style.display = '';
    submitBtn.disabled = false;
  }

  document.getElementById('submitMatch').addEventListener('click', async () => {
    const winnerId = document.getElementById('winnerId').value;
    const loserId = document.getElementById('loserId').value;
    const btn = document.getElementById('submitMatch');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    try {
      await api('POST', '/api/matches', { winnerId, loserId });
      // Reset form
      document.getElementById('winnerSearch').value = '';
      document.getElementById('loserSearch').value = '';
      document.getElementById('winnerId').value = '';
      document.getElementById('loserId').value = '';
      document.getElementById('matchPreview').style.display = 'none';

      const winner = players.find(p => p.id === winnerId);
      const loser = players.find(p => p.id === loserId);
      toast(`${winner?.name} defeated ${loser?.name}`);

      // Refresh players list for updated ELOs
      players = await api('GET', '/api/players');
    } catch (err) {
      toast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Record Result';
    }
  });

  // --- INIT ---
  function loadAll() {
    loadLeaderboard();
    loadPlayersForDropdowns();
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Check existing session on load
  if (token) {
    api('GET', '/api/players').then(() => {
      showApp();
    }).catch(() => {
      showLogin();
    });
  } else {
    // Show leaderboard tab without login
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('app').style.display = '';
    // Public mode - show leaderboard but hide auth-protected tabs
    document.getElementById('rolePill').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('app').querySelector('.auth-badge').innerHTML =
      '<button class="btn-login-header" id="loginHeaderBtn">Sign in</button>';
    document.getElementById('loginHeaderBtn').addEventListener('click', () => {
      document.getElementById('loginOverlay').classList.remove('hidden');
    });
    // Hide tabs that need auth
    document.querySelectorAll('.tab-btn[data-tab="record"], .tab-btn[data-tab="players"]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!token) {
          document.getElementById('loginOverlay').classList.remove('hidden');
        }
      });
    });
    loadLeaderboard();
  }

  // Init dropdowns after DOM ready
  makeDropdown('winnerSearch', 'winnerDropdown', 'winnerId', 'loserId');
  makeDropdown('loserSearch', 'loserDropdown', 'loserId', 'winnerId');
</script>
</body>
</html>
